
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Assignment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f7fb;
            color: #222;
        }

        h1 {
            color: #174ea6;
            text-align: center;
        }

        section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            color: #174ea6;
        }

        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.8;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>JavaScript Assignment</h1>

    <section>
        <h2>Question 1: Student Grading System</h2>
        <pre id="gradingOutput"></pre>
    </section>

    <section>
        <h2>Question 2: FizzBuzz Challenge</h2>
        <pre id="fizzbuzzOutput"></pre>
    </section>

    <script>
        // QUESTION 1: STUDENT GRADING SYSTEM

        let firstName = "Chinaza";
        let lastName = "Peace";

        let subject1 = 25;
        let subject2 = 30;
        let subject3 = 20;

        let totalScore = subject1 + subject2 + subject3;
        let remark;

        if (totalScore >= 70) {
            remark = "Excellent";
        } else if (totalScore >= 50) {
            remark = "Good";
        } else if (totalScore >= 35) {
            remark = "You can do better";
        } else {
            remark = "Fail";
        }

        let gradingResult =
            "STUDENT EXAMINATION RESULT\n" +
            "Full Name: " + firstName + " " + lastName + "\n" +
            "Subject 1: " + subject1 + "\n" +
            "Subject 2: " + subject2 + "\n" +
            "Subject 3: " + subject3 + "\n" +
            "Total Score: " + totalScore + "\n" +
            "Remark: " + remark;

        document.getElementById("gradingOutput").textContent =
            gradingResult;

        console.log(gradingResult);


        // QUESTION 2: FIZZBUZZ CHALLENGE

        let fizzBuzzResult = [];

        for (let number = 1; number <= 100; number++) {
            if (number % 3 === 0 && number % 5 === 0) {
                fizzBuzzResult.push("FizzBuzz");
            } else if (number % 3 === 0) {
                fizzBuzzResult.push("Fizz");
            } else if (number % 5 === 0) {
                fizzBuzzResult.push("Buzz");
            } else {
                fizzBuzzResult.push(number);
            }
        }

        document.getElementById("fizzbuzzOutput").textContent =
            fizzBuzzResult.join("\n");

        console.log(fizzBuzzResult.join("\n"));
    </script>

</body>
</html>
